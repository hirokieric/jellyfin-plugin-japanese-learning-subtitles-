changelog: |
  v1.0.0.0 - Initial release
  - Library scan with movie/episode filtering
  - OpenSubtitles integration for Japanese subtitle fetching
  - Dynamic programming alignment engine
  - Translation fallback (OpenAI, DeepL, Custom HTTP)
  - Sidecar .ja.srt naming
  - Generation caching and idempotency
