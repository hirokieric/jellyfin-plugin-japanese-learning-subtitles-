overview: "Generates Japanese SRT subtitles aligned to existing English subtitle timings for dual-subtitle English learning."
description: >
  This plugin periodically scans your Jellyfin library and generates Japanese SRT subtitle files
  aligned to existing English subtitle timings. It supports fetching existing Japanese subtitles
  from OpenSubtitles and aligning them, or translating English subtitles to Japanese using
  OpenAI, DeepL, or a custom HTTP endpoint.
